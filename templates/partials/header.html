{% load static %}
<header class="site-header">
  <nav>
    <div class="nav-row">
      <a href="{% url 'home' %}" class="logo-link" aria-label="Olife home">
        <img src="{% static 'images/olife1logo.png' %}" alt="Olife Logo" width="40" height="40" class="logo-img">
      </a>

      <div class="desktop-nav">
        <div class="desktop-links">
          <a href="{% url 'fragments' %}">Fragments</a>
          <a href="{% url 'blog' %}">Blog</a>
          <a href="{% url 'about' %}">About</a>
          <a href="{% url 'contact' %}">Contact</a>
        </div>
        <a href="{% url 'contact' %}" class="btn-join">Join Us</a>
      </div>

      <button class="menu-toggle" type="button" id="menu-toggle" aria-label="Open Menu" aria-expanded="false">
        <svg id="icon-open" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
        <svg id="icon-close" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="mobile-menu" id="mobile-menu">
      <a href="{% url 'fragments' %}">Fragments</a>
      <a href="{% url 'blog' %}">Blog</a>
      <a href="{% url 'about' %}">About</a>
      <a href="{% url 'contact' %}">Contact</a>
      <a href="{% url 'contact' %}" class="btn-join">Join Us</a>
    </div>

    <div class="brand-row">
      <div class="brand-spacer" aria-hidden="true"></div>
      <a href="{% url 'home' %}" class="brand-name">Olife</a>
      <div class="social-slot">
        <a href="#" aria-label="Follow us on Facebook">
          <svg fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/>
          </svg>
        </a>
      </div>
    </div>
