{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Olife{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Olife — a sanctuary where imagination is welcomed and valued.{% endblock %}">
  {% block meta_extra %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="icon" href="{% static 'images/favicon.png' %}" type="image/png">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  {% if FEATURE_GA4 and GA4_MEASUREMENT_ID %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ GA4_MEASUREMENT_ID }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ GA4_MEASUREMENT_ID }}');
  </script>
  {% endif %}
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% include "partials/header.html" %}
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'js/site.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
